name: Deploy production

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: CI, image, and VPS deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Resolve image name
        run: |
          image="$(echo "${{ env.REGISTRY }}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "COMPOSE_B64=$(base64 -w0 deploy/docker-compose.yml)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Wait for SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          for attempt in 1 2 3 4 5; do
            if python3 -c "import os, socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.settimeout(20); s.connect((os.environ['VPS_HOST'], 22)); s.close()"; then
              echo "SSH port reachable"
              exit 0
            fi
            echo "attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          echo "Could not reach VPS_HOST:22 from this runner (TCP timeout)."
          echo "Check the VPS provider firewall / IP allowlist — GitHub-hosted runner IPs rotate."
          exit 1

      # One SSH session (no separate SCP). GitHub-hosted runners have rotating
      # IPs; a 30s TCP dial often flakes even when sshd is up.
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        env:
          PORTFOLIO_IMAGE: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPOSE_B64: ${{ env.COMPOSE_B64 }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          protocol: tcp4
          timeout: 2m
          envs: PORTFOLIO_IMAGE,GHCR_USER,GHCR_TOKEN,COMPOSE_B64,VPS_APP_DIR
          script_stop: true
          command_timeout: 10m
          capture_stdout: true
          script: |
            set -euo pipefail
            : "${VPS_APP_DIR:?Set the VPS_APP_DIR GitHub secret to the Compose directory on the server}"
            mkdir -p "${VPS_APP_DIR}"
            printf '%s' "${COMPOSE_B64}" | base64 -d > "${VPS_APP_DIR}/docker-compose.yml"
            cd "${VPS_APP_DIR}"

            if [ ! -f .env ]; then
              echo "Missing ${VPS_APP_DIR}/.env" >&2
              exit 1
            fi

            env_value() {
              grep -E "^${1}=" .env 2>/dev/null | tail -n1 | cut -d= -f2- | tr -d '"' | tr -d "'" | tr -d ' \t\r' || true
            }

            # Compose interpolates Traefik Host() from SITE_HOST. An empty value
            # makes the public site 404 while /api/health inside the container is fine.
            SITE_HOST="$(env_value SITE_HOST)"
            if [ -z "${SITE_HOST}" ]; then
              AUTH_URL_VAL="$(env_value AUTH_URL)"
              SITE_HOST="$(printf '%s' "${AUTH_URL_VAL}" | sed -E 's#^https?://##; s#/.*##' | sed -E 's/^www\.//')"
              if [ -n "${SITE_HOST}" ]; then
                echo "SITE_HOST missing in .env; using hostname from AUTH_URL (${SITE_HOST})" >&2
                printf '\nSITE_HOST=%s\n' "${SITE_HOST}" >> .env
              fi
            fi
            if [ -z "${SITE_HOST}" ]; then
              echo "SITE_HOST is not set in ${VPS_APP_DIR}/.env and AUTH_URL has no hostname." >&2
              echo "Add: SITE_HOST=ammartariq.com  (hostname only, no https://)" >&2
              exit 1
            fi
            export SITE_HOST

            previous_image=""
            container_id="$(docker compose ps -q portfolio 2>/dev/null || true)"
            if [ -n "${container_id}" ]; then
              previous_image="$(docker inspect --format='{{.Config.Image}}' "${container_id}" 2>/dev/null || true)"
            fi

            cleanup() { docker logout ghcr.io >/dev/null 2>&1 || true; }
            trap cleanup EXIT

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin >/dev/null
            docker pull "${PORTFOLIO_IMAGE}"
            export PORTFOLIO_IMAGE

            # Persist the image tag into the server-side .env so future manual
            # restarts don't require exporting PORTFOLIO_IMAGE in the shell.
            if [ -f ".env" ]; then
              if grep -q '^PORTFOLIO_IMAGE=' .env; then
                sed -i "s#^PORTFOLIO_IMAGE=.*#PORTFOLIO_IMAGE=${PORTFOLIO_IMAGE}#g" .env
              else
                printf '\nPORTFOLIO_IMAGE=%s\n' "${PORTFOLIO_IMAGE}" >> .env
              fi
            else
              printf 'PORTFOLIO_IMAGE=%s\n' "${PORTFOLIO_IMAGE}" > .env
            fi

            docker compose up -d --pull never
            echo "Traefik Host rule uses SITE_HOST=${SITE_HOST}" >&2

            # Requires Mongo to be connected (or intentionally not configured,
            # e.g. a fork running placeholder content). A container that only
            # serves the static fallback because it cannot reach the database
            # must fail the deploy instead of shipping silently.
            wait_for_health() {
              for _health_i in $(seq 1 30); do
                if docker compose exec -T portfolio node -e "fetch('http://127.0.0.1:3000/api/health').then((r)=>r.json()).then((b)=>{const ok=b.status==='ok'&&(b.mongo==='connected'||b.mongo==='not-configured');process.exit(ok?0:1)}).catch(()=>process.exit(1))"; then
                  return 0
                fi
                sleep 2
              done
              return 1
            }

            if wait_for_health; then
              echo "Health check passed"
              exit 0
            fi

            echo "Health check failed"

            if [ -n "${previous_image}" ] && [ "${previous_image}" != "${PORTFOLIO_IMAGE}" ]; then
              echo "Rolling back to previous image"
              PORTFOLIO_IMAGE="${previous_image}"
              export PORTFOLIO_IMAGE
              docker compose up -d --pull never
              if wait_for_health; then
                echo "Rollback health check passed"
              else
                echo "Rollback health check failed"
              fi
            else
              echo "No previous image available to roll back to"
            fi

            exit 1
