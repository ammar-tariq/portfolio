name: Deploy production

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: CI, image, and VPS deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Resolve image name
        run: |
          image="$(echo "${{ env.REGISTRY }}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy Compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/docker-compose.yml
          target: /opt/apps/portfolio/production
          strip_components: 1
          overwrite: true

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        env:
          PORTFOLIO_IMAGE: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: PORTFOLIO_IMAGE,GHCR_USER,GHCR_TOKEN
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /opt/apps/portfolio/production

            previous_image=""
            container_id="$(docker compose ps -q portfolio 2>/dev/null || true)"
            if [ -n "${container_id}" ]; then
              previous_image="$(docker inspect --format='{{.Config.Image}}' "${container_id}" 2>/dev/null || true)"
            fi

            cleanup() { docker logout ghcr.io >/dev/null 2>&1 || true; }
            trap cleanup EXIT

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin >/dev/null
            docker pull "${PORTFOLIO_IMAGE}"
            export PORTFOLIO_IMAGE
            docker compose up -d --pull never

            # Requires Mongo to be connected (or intentionally not configured,
            # e.g. a fork running placeholder content). A container that only
            # serves the static fallback because it cannot reach the database
            # must fail the deploy instead of shipping silently.
            wait_for_health() {
              for _health_i in $(seq 1 30); do
                if docker compose exec -T portfolio node -e "fetch('http://127.0.0.1:3000/api/health').then((r)=>r.json()).then((b)=>{const ok=b.status==='ok'&&(b.mongo==='connected'||b.mongo==='not-configured');process.exit(ok?0:1)}).catch(()=>process.exit(1))"; then
                  return 0
                fi
                sleep 2
              done
              return 1
            }

            if wait_for_health; then
              echo "Health check passed"
              exit 0
            fi

            echo "Health check failed"

            if [ -n "${previous_image}" ] && [ "${previous_image}" != "${PORTFOLIO_IMAGE}" ]; then
              echo "Rolling back to previous image"
              PORTFOLIO_IMAGE="${previous_image}"
              export PORTFOLIO_IMAGE
              docker compose up -d --pull never
              if wait_for_health; then
                echo "Rollback health check passed"
              else
                echo "Rollback health check failed"
              fi
            else
              echo "No previous image available to roll back to"
            fi

            exit 1
